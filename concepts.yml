context: secrets
name: Secrets Management
intro: >-
  The common secrets vocabulary -- the secrets an application stores, the versions each one
  keeps, the stores and vaults that hold them and the encryption keys that protect them --
  distilled from the APIs that already exist.
tags: [Secrets Management, Key Management, Password Management, Vault, Secrets, Encryption, KMS, Password Manager]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, secret_id, key_id, uid]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, created_time, creation_time]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified, last_changed_date]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags, labels, annotations]
  status: [state, enabled, is_enabled, active, disabled]
  name: [title, display_name, label, key, path, secret_name]
  description: [notes, note, details, comment]

concepts:
  secret:
    segments: [secrets, secret, "items@vaults|vault|safes", credentials@vault|secrets, passwords@vault|vaults, "kv@v1|v2|secret", parameters@ssm|store]
    aliases:
      value: [secret_value, secret, data, secret_string, payload, plaintext]
      store_id: [vault_id, vault, project_id, project, environment, safe, folder_id, path_prefix]
      version: [version_id, latest_version, current_version, version_number]
      expires_at: [expiration, expiry, expiration_date, expire_at, rotation_date]
      type: [secret_type, kind, category]
  # secret_version was measured and dropped: 2 providers expose versions as a resource.
  secret_store:
    requires: [secret]
    path: /secret-stores
    segments: [vaults, vault, safes, safe, secret_stores, secret-stores, keyvaults, folders@secrets|vault, environments@secrets|projects]
    aliases:
      type: [vault_type, kind]
      member_count: [members, permissions]
  encryption_key:
    path: /encryption-keys
    segments: [crypto_keys, cryptokeys, crypto-keys, "keys@kms|keyrings|vaults|vault|transit", key_rings, keyrings, master_keys, encryption_keys]
    aliases:
      algorithm: [key_spec, purpose, key_type, kty, algorithm_name]
      rotation_period: [rotation_schedule, rotation_interval, next_rotation_time]
      key_state: [state, status, enabled]

duplicates:
  hashicorp-vault: [hvault]

findings:
  - "A secret agrees on name, type, id and timestamps -- and never on its value: providers return
    secret metadata on the resource and the value through a separate read, so the value does not
    reach core anywhere."
  - "Secrets management publishes thinly: 46 providers in the cohort, 12 mapped."
decisions:
  - "Password-manager items in a vault, credentials and passwords beneath a vault, KV paths and
    parameter-store parameters are secrets."
  - "Vaults, safes and secret environments are `/secret-stores`: crypto custody owns the bare
    word vault in the crypto-wallets context."
  - "Encryption keys are `/encryption-keys` and count only beneath a KMS, key ring, vault or
    transit path: identity owns API keys."
  - "Secret versions were measured and dropped (2 providers)."
  - "Duplicates merged: HVault into HashiCorp Vault."
